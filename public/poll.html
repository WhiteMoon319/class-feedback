<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票详情 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908b">
<link rel="stylesheet" href="/css/base.css?v=20260908b">
</head>
<body data-nav="/polls">
<header class="site-header"></header>
<main>
  <div id="backRow"></div>
  <div id="view"></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, refreshMe, isCommittee, escapeHtml, fmtTime, toast, skeleton, errorBox, armDangerButton, renderBackLink, initReveal, $, $$ } from '/js/app.js?v=20260908b';
  init();
  $('#backRow').appendChild(renderBackLink('/polls', '返回投票'));
  const me = await refreshMe();
  const id = new URLSearchParams(location.search).get('id');

  // ---------- 创建模式（班委） ----------
  if (!id && isCommittee()) {
    $('#view').innerHTML = `
      <section class="card">
        <div class="card-title">发起投票</div>
        <form id="newForm">
          <label for="ptitle">议题</label>
          <input type="text" id="ptitle" required minlength="2" maxlength="60" placeholder="如：下周三是否组织班级聚餐">
          <label for="pdesc">说明（可选）</label>
          <textarea id="pdesc" maxlength="800" placeholder="补充背景信息，让投票更有依据"></textarea>
          <label for="poptions">选项（每行一个，2-10 个）</label>
          <textarea id="poptions" required placeholder="支持&#10;反对&#10;弃权"></textarea>
          <label for="pexpires">截止时间（默认 24 小时后）</label>
          <input type="datetime-local" id="pexpires">
          <label style="display:flex;gap:var(--space-2);align-items:center">
            <input type="checkbox" id="phide" style="width:auto"> 截止前隐藏票数
          </label>
          <div style="margin-top:var(--space-4)">
            <button class="btn btn-primary" type="submit">发布投票</button>
          </div>
        </form>
      </section>`;

    const d = new Date(Date.now() + 24 * 3600_000);
    const pad = (n) => String(n).padStart(2, '0');
    $('#pexpires').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

    $('#newForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const options = $('#poptions').value.split('\n').map((s) => s.trim()).filter(Boolean);
      try {
        const r = await api('POST', '/api/polls', {
          title: $('#ptitle').value.trim(),
          description: $('#pdesc').value.trim(),
          options,
          expiresAt: $('#pexpires').value,
          hideResults: $('#phide').checked,
        });
        toast('投票已发布');
        location.href = `/poll?id=${r.id}`;
      } catch (err) { toast(err.message); }
    });
  } else if (!id) {
    location.href = '/polls';
  } else {
    // ---------- 查看/投票模式 ----------
    let poll;
    $('#view').innerHTML = `<div class="card">${skeleton(5)}</div>`;
    try {
      const r = await api('GET', `/api/polls/${id}`);
      poll = r.poll;
    } catch (err) {
      $('#view').innerHTML = errorBox(err.message, () => location.reload());
      poll = null;
    }

    if (poll) {
      const open = poll.status === 'open';
      const hidden = poll.hideResults && open;
      const showCounts = !hidden;

      $('#view').innerHTML = `
        <section class="card card-reveal">
          <div class="item-head" style="margin-bottom:var(--space-2)">
            <h1 class="page-title" style="margin:0">${escapeHtml(poll.title)}</h1>
            <span class="badge ${open ? 'badge-in_review' : 'badge-resolved'}">${poll.statusText}</span>
          </div>
          <div class="card-meta" style="margin-bottom:var(--space-4)">
            <span>${escapeHtml(poll.duty)} 发起</span>
            <span>${fmtTime(poll.createdAt)}</span>
            <span id="countdownEl"></span>
            ${hidden ? '<span>结果截止后公开</span>' : `<span>${poll.totalVotes} 人已投</span>`}
          </div>
          ${poll.description ? `<p class="item-excerpt" style="margin-bottom:var(--space-4)">${escapeHtml(poll.description)}</p>` : ''}

          ${open && me && poll.myVote != null
            ? `<div class="notice notice-info">你已投票（${escapeHtml(poll.options[poll.myVote]?.text ?? '')}），截止前可改票。</div>` : ''}
          ${open && !me ? '<div class="notice notice-warn"><a href="/login">登录</a>后可投票。</div>' : ''}

          <div id="optionsBox">${poll.options.map((o, i) => `
            <div class="reply">
              <div style="display:flex;justify-content:space-between;gap:var(--space-2);align-items:center">
                <span style="font-weight:${poll.myVote === i ? '600' : '400'};color:${poll.myVote === i ? 'var(--c-accent)' : 'inherit'}">
                  ${poll.myVote === i ? '✓ ' : ''}${escapeHtml(o.text)}
                </span>
                ${showCounts ? `<span class="card-meta">${o.votes} 票</span>` : ''}
              </div>
              ${showCounts && poll.totalVotes > 0 ? `
                <div style="height:5px;background:var(--c-surface-2);border-radius:3px;margin-top:var(--space-2);overflow:hidden">
                  <div class="bar-grow" style="height:100%;width:${Math.round((o.votes / poll.totalVotes) * 100)}%;background:var(--c-accent);border-radius:3px"></div>
                </div>` : ''}
            </div>`).join('')}</div>

          ${open && me ? `
            <form id="voteForm" style="margin-top:var(--space-4)">
              <label for="voteSel">${poll.myVote != null ? '改投' : '选择'}</label>
              <select id="voteSel">
                ${poll.options.map((o, i) => `<option value="${i}" ${poll.myVote === i ? 'selected' : ''}>${escapeHtml(o.text)}</option>`).join('')}
              </select>
              <div style="margin-top:var(--space-2)">
                <button class="btn btn-primary" type="submit">${poll.myVote != null ? '改投' : '投票'}</button>
              </div>
            </form>` : ''}

          ${isCommittee() ? `
            <details class="menu">
              <summary>管理投票</summary>
              <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap">
                ${open ? '<button class="btn btn-sm" id="closeBtn" type="button">提前截止</button>' : ''}
                <button class="btn btn-sm btn-danger" id="delBtn" type="button">删除投票</button>
              </div>
            </details>` : ''}
        </section>`;

      // 倒计时（详情页保留秒级）
      const tick = () => {
        const el = $('#countdownEl');
        if (!el) return;
        const left = new Date(poll.expiresAt.replace(' ', 'T') + 'Z') - Date.now();
        if (left <= 0) { el.textContent = '已截止'; return; }
        const h = Math.floor(left / 3600_000);
        const m = Math.floor((left % 3600_000) / 60_000);
        const s = Math.floor((left % 60_000) / 1000);
        el.textContent = h > 0 ? `剩余 ${h} 小时 ${m} 分 ${s} 秒` : `剩余 ${m} 分 ${s} 秒`;
      };
      tick();
      setInterval(tick, 1000);
      initReveal();

      $('#voteForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api('POST', `/api/polls/${id}/vote`, { optionIndex: Number($('#voteSel').value) });
          toast('已记录你的投票');
          setTimeout(() => location.reload(), 600);
        } catch (err) { toast(err.message); }
      });

      $('#delBtn')?.addEventListener('click', () => {
        armDangerButton($('#delBtn'), async () => {
          $('#delBtn').disabled = true;
          try {
            await api('POST', `/api/polls/${id}/delete`);
            toast('已删除');
            location.href = '/polls';
          } catch (err) { toast(err.message); $('#delBtn').disabled = false; }
        }, '再点一次确认删除');
      });

      // 提前截止：票数保留，仅结束投票
      $('#closeBtn')?.addEventListener('click', () => {
        armDangerButton($('#closeBtn'), async () => {
          $('#closeBtn').disabled = true;
          try {
            await api('POST', `/api/polls/${id}/close`);
            toast('投票已截止');
            setTimeout(() => location.reload(), 500);
          } catch (err) { toast(err.message); $('#closeBtn').disabled = false; }
        }, '再点一次确认截止');
      });
    }
  }
</script>
</body>
</html>
