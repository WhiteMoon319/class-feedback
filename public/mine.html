<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的反馈 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908b">
<link rel="stylesheet" href="/css/base.css?v=20260908b">
</head>
<body data-nav="/mine">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">我的反馈</h1>
      <p class="page-sub">按你的账号聚合，仅登录后自己可见。每条反馈的对外笔名各不相同。</p>
    </div>
    <div class="page-head-actions">
      <a class="btn btn-primary" href="/submit">提交反馈</a>
      <a class="btn" href="/settings">账号设置</a>
    </div>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, refreshMe, api, escapeHtml, statusBadge, fmtTime, requireLoginPage, toast, skeleton, errorBox, initReveal, renderPager, armDangerButton, $ } from '/js/app.js?v=20260908b';
  init();
  if (requireLoginPage()) {
    await refreshMe();
    let page = 1;
  let total = 0;
    const PAGE_SIZE = 20;

    function render(items) {
      if (items.length === 0) {
        $('#list').innerHTML = '<div class="empty">你还没有提交过反馈</div>';
        return;
      }
      $('#list').innerHTML = items.map((f, i) => `
        <div class="card card-reveal" style="animation-delay:${Math.min(i * 80, 480)}ms">
          <div class="item-head">
            <a class="item-title" href="/feedback?id=${f.id}">${escapeHtml(f.title)}</a>
            ${statusBadge(f.status)}
          </div>
          <div class="card-meta">
            <span>对外笔名：${escapeHtml(f.alias)}</span>
            <span>${fmtTime(f.createdAt)}</span>
            <span>${f.replyCount ?? 0} 条回复</span>
          </div>
          <p class="item-excerpt">${escapeHtml(f.body.length > 80 ? f.body.slice(0, 80) + '…' : f.body)}</p>
          <div class="page-head-actions" style="margin-top:var(--space-3)">
            <button class="btn btn-sm" data-withdraw="${f.id}" type="button">撤回</button>
          </div>
        </div>`).join('');
      initReveal('#list');
    }

    async function load(target = page) {
      page = target;
      $('#list').innerHTML = skeleton(3);
      try {
        const r = await api('GET', `/api/my/feedbacks?limit=${PAGE_SIZE}&offset=${(page - 1) * PAGE_SIZE}`);
        total = r.total;
        render(r.items);
        renderPager($('#pager'), {
          page,
          totalPages: Math.ceil(total / PAGE_SIZE),
          onPage: (p) => { window.scrollTo({ top: 0 }); load(p); },
        });
      } catch (err) {
        $('#list').innerHTML = errorBox(err.message, () => load(page));
      }
    }

    $('#list').innerHTML = skeleton(3);
    load();

    // 撤回自己的反馈（已有班委回复时后端会拒绝并提示）
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-withdraw]');
      if (!btn) return;
      armDangerButton(btn, async () => {
        btn.disabled = true;
        try {
          await api('POST', `/api/feedbacks/${btn.dataset.withdraw}/delete`);
          toast('已撤回');
          load(1);
        } catch (err) { toast(err.message); btn.disabled = false; }
      }, '再点一次确认撤回');
    });
  }
</script>
</body>
</html>
