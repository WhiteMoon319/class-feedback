<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班务详情 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
</head>
<body data-nav="/announcements">
<header class="site-header"></header>
<main>
  <div id="backRow"></div>
  <div id="detail"></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, escapeHtml, categoryBadge, fmtTime, toast, skeleton, errorBox, renderBackLink, $ } from '/js/app.js';
  init();
  $('#backRow').appendChild(renderBackLink('/announcements', '返回班务公开'));

  const id = new URLSearchParams(location.search).get('id');
  if (!id || !/^\d+$/.test(id)) location.href = '/announcements';

  $('#detail').innerHTML = `<div class="card">${skeleton(5)}</div>`;
  try {
    const r = await api('GET', `/api/announcements/${id}`);
    const a = r.announcement;
    $('#detail').innerHTML = `
      <div class="card">
        <div class="item-head" style="margin-bottom:var(--space-2)">
          <h1 class="page-title" style="margin:0">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</h1>
          ${categoryBadge(a)}
        </div>
        <div class="card-meta" style="margin-bottom:var(--space-4)">
          <span>${escapeHtml(a.duty)}</span>
          <span>${fmtTime(a.createdAt)}</span>
          ${a.amount ? `<span class="amount-${a.direction === 'expense' ? 'expense' : 'income'}">${a.direction === 'expense' ? '支出' : '收入'} ¥${escapeHtml(a.amount.replace('-', ''))}</span>` : ''}
          ${a.updatedAt && a.updatedAt !== a.createdAt ? `<span>更新于 ${fmtTime(a.updatedAt)}</span>` : ''}
        </div>
        <p class="item-excerpt" style="white-space:pre-wrap">${escapeHtml(a.body)}</p>
        ${a.attachments?.length ? `
          <div style="margin-top:var(--space-5)">
            <div class="card-title" style="font-size:14px">附件</div>
            <div class="attachments">${a.attachments.map((att) =>
              `<a href="${att.url}" target="_blank" rel="noopener"><img src="${att.url}" alt="${escapeHtml(att.filename)}" loading="lazy" decoding="async"></a>`).join('')}
            </div>
          </div>` : ''}
      </div>`;
  } catch (err) {
    $('#detail').innerHTML = errorBox(err.message, () => location.reload());
  }
</script>
</body>
</html>
