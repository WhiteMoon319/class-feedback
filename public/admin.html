<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908b">
<link rel="stylesheet" href="/css/base.css?v=20260908b">
</head>
<body data-nav="/admin">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">管理</h1>
      <p class="page-sub">班委日常工作台。封禁、成员列表与全量审计日志仅站点维护者可见。</p>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist">
    <button data-t="publish" aria-selected="true">发布班务</button>
    <button data-t="invites">邀请码</button>
    <button data-t="reports">举报</button>
    <button data-t="hidden">隐藏内容</button>
    <button data-t="members" id="membersTab" hidden>成员</button>
    <button data-t="audit" id="auditTab" hidden>审计日志</button>
  </div>

  <!-- 发布 / 编辑 -->
  <section id="tab-publish">
    <div class="card">
      <div class="card-title" id="pubTitle">新发布</div>
      <form id="pubForm">
        <label for="pcat">类别</label>
        <select id="pcat">
          <option value="announcement">公告</option>
          <option value="finance">班费</option>
          <option value="minutes">决议</option>
        </select>
        <label for="ptitle">标题</label>
        <input type="text" id="ptitle" required minlength="2" maxlength="80">
        <label for="pbody">正文</label>
        <textarea id="pbody" required maxlength="8000"></textarea>
        <div id="financeRow" hidden>
          <label for="pamount">金额（正数收入，负数支出，如 -128.00）</label>
          <input type="text" id="pamount" placeholder="-128.00" maxlength="24">
        </div>
        <label id="pinnedRow" style="display:flex;gap:var(--space-2);align-items:center">
          <input type="checkbox" id="ppinned" style="width:auto"> 置顶
        </label>
        <label for="pimages">凭证图片（可多选，JPG/PNG/WebP，单张 ≤5MB）</label>
        <input type="file" id="pimages" accept="image/jpeg,image/png,image/webp" multiple>
        <div style="margin-top:var(--space-3);display:flex;gap:var(--space-2)">
          <button class="btn btn-primary" type="submit" id="pubSubmit">发布</button>
          <button class="btn" type="button" id="cancelEdit" hidden>取消编辑</button>
        </div>
      </form>
    </div>
    <div id="recentList"></div>
  </section>

  <!-- 邀请码 -->
  <section id="tab-invites" hidden>
    <div class="card">
      <div class="card-title">生成邀请码</div>
      <form id="inviteForm">
        <label for="itype">类型</label>
        <select id="itype">
          <option value="student">学生（可发进班级群）</option>
          <option value="committee">班委（仅私发，需填职务）</option>
          <option value="owner">站点维护者（仅私发）</option>
        </select>
        <label for="iduty">职务（仅班委码需要）</label>
        <input type="text" id="iduty" maxlength="20" placeholder="如：学习委员">
        <label for="icount">数量</label>
        <input type="number" id="icount" value="5" min="1" max="50">
        <button class="btn btn-primary" type="submit">生成</button>
      </form>
      <div id="newCodes"></div>
    </div>
    <div class="card">
      <div class="card-title">现有邀请码</div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:var(--space-2)">
        <label style="display:flex;gap:var(--space-2);align-items:center;margin:0">
          <input type="checkbox" id="onlyUnused" style="width:auto"> 只看未使用
        </label>
      </div>
      <div style="overflow-x:auto"><table class="table" id="inviteTable"></table></div>
    </div>
  </section>

  <!-- 举报 -->
  <section id="tab-reports" hidden>
    <div id="reportList"></div>
  </section>

  <!-- 隐藏内容 -->
  <section id="tab-hidden" hidden>
    <div id="hiddenList"></div>
  </section>

  <!-- 成员（owner） -->
  <section id="tab-members" hidden>
    <div class="card">
      <div class="card-title">成员</div>
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-3)">
        <input type="text" id="memberSearch" placeholder="按昵称搜索" maxlength="40">
        <button class="btn" id="memberSearchBtn" type="button">搜索</button>
      </div>
      <div style="overflow-x:auto"><table class="table" id="memberTable"></table></div>
    </div>
  </section>

  <!-- 审计日志（owner） -->
  <section id="tab-audit" hidden>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2)">
        <div class="card-title" style="margin:0">审计日志</div>
        <button class="btn btn-sm" id="verifyBtn" type="button">校验哈希链</button>
      </div>
      <div id="chainResult"></div>
      <div style="overflow-x:auto;margin-top:var(--space-2)"><table class="table" id="auditTable"></table></div>
      <div class="load-more"><button class="btn" id="auditMore" hidden>加载更多</button></div>
    </div>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, refreshMe, api, escapeHtml, fmtTime, isCommittee, toast, armDangerButton, $, $$ } from '/js/app.js?v=20260908b';
  init();

  const me = await refreshMe();
  if (!me) { location.href = '/login'; }
  else if (!isCommittee()) { document.querySelector('main').innerHTML = '<div class="empty">只有班委可以进入管理页</div>'; }
  else {
    const isOwner = me.role === 'owner';
    if (isOwner) { $('#auditTab').hidden = false; $('#membersTab').hidden = false; }
    bootstrap();
  }

  let editingId = null;

  function bootstrap() {
    $('#tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-t]');
      if (!btn) return;
      $$('#tabs button').forEach((b) => b.setAttribute('aria-selected', b === btn));
      ['publish', 'invites', 'reports', 'hidden', 'members', 'audit'].forEach((t) => {
        $(`#tab-${t}`).hidden = t !== btn.dataset.t;
      });
      if (btn.dataset.t === 'invites') loadInvites();
      if (btn.dataset.t === 'reports') loadReports();
      if (btn.dataset.t === 'hidden') loadHidden();
      if (btn.dataset.t === 'members' && me.role === 'owner') loadMembers();
      if (btn.dataset.t === 'audit' && me.role === 'owner') loadAudit();
    });

    // ---------- 发布 / 编辑 ----------
    $('#pcat').addEventListener('change', () => {
      $('#financeRow').hidden = $('#pcat').value !== 'finance';
    });
    $('#cancelEdit').addEventListener('click', resetForm);

    $('#pubForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cat = $('#pcat').value;
      const body = {
        category: cat, title: $('#ptitle').value.trim(), body: $('#pbody').value.trim(),
        pinned: $('#ppinned').checked,
      };
      if (cat === 'finance') {
        body.amount = $('#pamount').value.trim();
        body.direction = body.amount.startsWith('-') ? 'expense' : 'income';
      }
      const btn = $('#pubSubmit');
      btn.disabled = true;
      try {
        let id = editingId;
        if (editingId) {
          await api('POST', `/api/announcements/${editingId}/update`, body);
          toast('已保存修改');
        } else {
          const r = await api('POST', '/api/announcements', body);
          id = r.id;
          toast('已发布');
        }
        // 上传选中的图片
        const files = $('#pimages').files;
        if (files && files.length) {
          let okCount = 0;
          for (const file of files) {
            const fd = new FormData();
            fd.append('file', file);
            try {
              await api('POST', `/api/announcements/${id}/attachments`, fd);
              okCount++;
            } catch (err) { toast(`图片 ${file.name} 上传失败：${err.message}`); }
          }
          if (okCount) toast(`已上传 ${okCount} 张图片`);
        }
        resetForm();
        loadRecent();
      } catch (err) { toast(err.message); }
      finally { btn.disabled = false; }
    });
    loadRecent();

    // ---------- 邀请码 ----------
    $('#inviteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const r = await api('POST', '/api/admin/invites', {
          type: $('#itype').value, count: Number($('#icount').value),
          duty: $('#itype').value === 'committee' ? $('#iduty').value.trim() : undefined,
        });
        $('#newCodes').innerHTML = `
          <div class="notice notice-info">
            已生成 ${r.codes.length} 个 ${r.expiresDays} 天内有效的邀请码：
            <div style="margin-top:var(--space-2)">${r.codes.map((c) => `<div class="code">${escapeHtml(c)}</div>`).join('')}</div>
          </div>`;
        loadInvites();
      } catch (err) { toast(err.message); }
    });
    $('#onlyUnused').addEventListener('change', loadInvites);

    // ---------- 审计 ----------
    $('#verifyBtn').addEventListener('click', async () => {
      try {
        const r = await api('GET', '/api/admin/audit/verify');
        $('#chainResult').innerHTML = r.chain.ok
          ? `<div class="notice notice-info">哈希链完整，共 ${r.chain.count} 行</div>`
          : `<div class="notice notice-danger">哈希链损坏：${escapeHtml(r.chain.reason)}（断点行 #${r.chain.brokenAtId ?? '?'}）</div>`;
      } catch (err) { toast(err.message); }
    });
    $('#auditMore').addEventListener('click', () => loadAudit());

    // ---------- 成员 ----------
    $('#memberSearchBtn').addEventListener('click', loadMembers);
    $('#memberSearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadMembers(); });
  }

  function resetForm() {
    editingId = null;
    $('#pubTitle').textContent = '新发布';
    $('#pubSubmit').textContent = '发布';
    $('#cancelEdit').hidden = true;
    $('#ptitle').value = '';
    $('#pbody').value = '';
    $('#pamount').value = '';
    $('#ppinned').checked = false;
    $('#pimages').value = '';
  }

  function startEdit(a) {
    editingId = a.id;
    $('#pubTitle').textContent = `编辑 #${a.id}`;
    $('#pubSubmit').textContent = '保存修改';
    $('#cancelEdit').hidden = false;
    $('#pcat').value = a.category;
    $('#financeRow').hidden = a.category !== 'finance';
    $('#ptitle').value = a.title;
    $('#pbody').value = a.body;
    $('#pamount').value = a.amount || '';
    $('#ppinned').checked = !!a.pinned;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function loadRecent() {
    try {
      const r = await api('GET', '/api/announcements?limit=10');
      $('#recentList').innerHTML = r.items.map((a) => `
        <div class="card">
          <div class="item-head">
            <span class="item-title">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</span>
            <span class="card-meta">${fmtTime(a.createdAt)}</span>
          </div>
          <div class="card-meta" style="margin-top:var(--space-2)">
            <span>${a.attachments?.length ? `📎 ${a.attachments.length} 张图片` : '无附件'}</span>
          </div>
          <div class="page-head-actions" style="margin-top:var(--space-3)">
            <button class="btn btn-sm" data-edit="${a.id}">编辑</button>
            <button class="btn btn-sm" data-upload="${a.id}">传图</button>
            <button class="btn btn-sm btn-danger" data-del="${a.id}">删除</button>
          </div>
        </div>`).join('') || '<div class="empty">还没有内容</div>';
      // 编辑按钮需要完整字段，缓存列表数据
      $('#recentList')._items = r.items;
    } catch { /* 失败不阻塞 */ }
  }

  // 全局委托：编辑 / 传图 / 删除 / 邀请码作废 / 隐藏恢复 / 举报处理 / 封禁
  document.addEventListener('click', async (e) => {
    const edit = e.target.closest('[data-edit]');
    if (edit) {
      const a = $('#recentList')._items?.find((x) => String(x.id) === edit.dataset.edit);
      if (a) startEdit(a);
      return;
    }
    const up = e.target.closest('[data-upload]');
    if (up) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/jpeg,image/png,image/webp';
      input.multiple = true;
      input.addEventListener('change', async () => {
        for (const file of input.files) {
          const fd = new FormData();
          fd.append('file', file);
          try {
            await api('POST', `/api/announcements/${up.dataset.upload}/attachments`, fd);
          } catch (err) { toast(`${file.name} 上传失败：${err.message}`); }
        }
        toast('图片已上传');
        loadRecent();
      });
      input.click();
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      armDangerButton(del, async () => {
        del.disabled = true;
        try {
          await api('POST', `/api/announcements/${del.dataset.del}/delete`);
          toast('已删除');
          loadRecent();
        } catch (err) { toast(err.message); del.disabled = false; }
      }, '再点一次确认删除');
      return;
    }
    const voidBtn = e.target.closest('[data-void]');
    if (voidBtn) {
      try { await api('POST', `/api/admin/invites/${voidBtn.dataset.void}/void`); toast('已作废'); loadInvites(); }
      catch (err) { toast(err.message); }
      return;
    }
    const handleBtn = e.target.closest('[data-handle]');
    if (handleBtn) {
      const action = handleBtn.dataset.handle;
      try {
        await api('POST', `/api/admin/reports/${handleBtn.dataset.rid}/handle`, { action });
        toast(action === 'ban' ? '已封禁并关闭举报' : action === 'hide' ? '已隐藏内容' : '已驳回');
        loadReports();
      } catch (err) { toast(err.message); }
      return;
    }
    const restoreFb = e.target.closest('[data-restore-fb]');
    if (restoreFb) {
      try { await api('POST', `/api/admin/feedbacks/${restoreFb.dataset.restoreFb}/hide`, { hidden: false }); toast('已恢复显示'); loadHidden(); }
      catch (err) { toast(err.message); }
      return;
    }
    const restoreRep = e.target.closest('[data-restore-rep]');
    if (restoreRep) {
      try { await api('POST', `/api/admin/replies/${restoreRep.dataset.restoreRep}/hide`, { hidden: false }); toast('已恢复显示'); loadHidden(); }
      catch (err) { toast(err.message); }
      return;
    }
    const banBtn = e.target.closest('[data-ban]');
    if (banBtn) {
      const next = banBtn.dataset.banned === '1' ? false : true;
      try {
        await api('POST', `/api/admin/members/${banBtn.dataset.ban}/ban`, { banned: next });
        toast(next ? '已封禁' : '已解封');
        loadMembers();
      } catch (err) { toast(err.message); }
    }
  });

  async function loadInvites() {
    try {
      const r = await api('GET', `/api/admin/invites${$('#onlyUnused').checked ? '?unused=1' : ''}`);
      $('#inviteTable').innerHTML = `
        <tr><th>码</th><th>类型</th><th>状态</th><th>创建</th><th></th></tr>
        ${r.items.map((i) => `
          <tr>
            <td class="code">${escapeHtml(i.code)}</td>
            <td>${escapeHtml(i.type)}${i.duty ? `·${escapeHtml(i.duty)}` : ''}</td>
            <td>${{ unused: '未使用', used: '已使用', void: '已作废' }[i.state]}</td>
            <td>${fmtTime(i.createdAt)}</td>
            <td>${i.state === 'unused' ? `<button class="btn btn-sm" data-void="${escapeHtml(i.code)}">作废</button>` : ''}</td>
          </tr>`).join('')}`;
    } catch (err) { toast(err.message); }
  }

  async function loadReports() {
    try {
      const r = await api('GET', '/api/admin/reports?handled=0');
      $('#reportList').innerHTML = r.items.length ? r.items.map((rep) => `
        <div class="card">
          <div class="card-title">举报 #${rep.id} · ${rep.targetType === 'feedback' ? '反馈' : '回复'}</div>
          <div class="card-meta" style="margin-bottom:var(--space-2)">
            <span>${fmtTime(rep.createdAt)}</span>
            <span>作者根假名：<strong>${escapeHtml(rep.target.rootName)}</strong></span>
            <span>对外笔名：${escapeHtml(rep.target.alias)}</span>
            <span>member #${rep.target.memberId}</span>
          </div>
          <p class="item-excerpt">举报理由：${escapeHtml(rep.reason)}</p>
          ${rep.target.title ? `<p style="margin:0 0 var(--space-1);font-weight:600">${escapeHtml(rep.target.title)}</p>` : ''}
          <p class="item-excerpt">${escapeHtml(rep.target.body || '')}</p>
          <div class="page-head-actions" style="margin-top:var(--space-3)">
            <button class="btn btn-sm" data-handle="hide" data-rid="${rep.id}">隐藏并关闭</button>
            <button class="btn btn-sm btn-danger" data-handle="ban" data-rid="${rep.id}">封禁作者</button>
            <button class="btn btn-sm" data-handle="dismiss" data-rid="${rep.id}">驳回</button>
          </div>
        </div>`).join('') : '<div class="empty">没有待处理的举报</div>';
    } catch (err) { toast(err.message); }
  }

  async function loadHidden() {
    try {
      const r = await api('GET', '/api/admin/hidden');
      const fbHtml = r.feedbacks.length ? r.feedbacks.map((f) => `
        <div class="card">
          <div class="item-head">
            <span class="item-title">${escapeHtml(f.title)}</span>
            <span class="badge badge-pending">已隐藏</span>
          </div>
          <div class="card-meta"><span>${escapeHtml(f.alias)}</span><span>${fmtTime(f.createdAt)}</span></div>
          <div class="page-head-actions" style="margin-top:var(--space-3)">
            <button class="btn btn-sm" data-restore-fb="${f.id}">恢复显示</button>
          </div>
        </div>`).join('') : '';
      const repHtml = r.replies.length ? r.replies.map((rep) => `
        <div class="card">
          <div class="item-head">
            <span class="item-title">回复 · ${escapeHtml(rep.displayName)}</span>
            <span class="badge badge-pending">已隐藏</span>
          </div>
          <div class="card-meta"><span>所属反馈 #${rep.feedbackId}</span><span>${fmtTime(rep.createdAt)}</span></div>
          <p class="item-excerpt">${escapeHtml(rep.body)}</p>
          <div class="page-head-actions" style="margin-top:var(--space-3)">
            <button class="btn btn-sm" data-restore-rep="${rep.id}">恢复显示</button>
          </div>
        </div>`).join('') : '';
      $('#hiddenList').innerHTML = (fbHtml + repHtml) || '<div class="empty">没有被隐藏的内容</div>';
    } catch (err) { toast(err.message); }
  }

  async function loadMembers() {
    try {
      const q = $('#memberSearch').value.trim();
      const r = await api('GET', `/api/admin/members${q ? `?q=${encodeURIComponent(q)}` : ''}`);
      $('#memberTable').innerHTML = `
        <tr><th>昵称</th><th>角色</th><th>状态</th><th>注册</th><th></th></tr>
        ${r.items.map((m) => `
          <tr>
            <td>${escapeHtml(m.displayName)}</td>
            <td>${m.role === 'owner' ? '维护者' : m.role === 'committee' ? `班委·${escapeHtml(m.duty || '')}` : '学生'}</td>
            <td>${m.banned ? '<span class="badge badge-pending">已封禁</span>' : '正常'}</td>
            <td>${fmtTime(m.createdAt)}</td>
            <td>${m.role === 'owner' ? '' : `<button class="btn btn-sm ${m.banned ? '' : 'btn-danger'}" data-ban="${m.id}" data-banned="${m.banned ? 1 : 0}">${m.banned ? '解封' : '封禁'}</button>`}</td>
          </tr>`).join('')}`;
    } catch (err) { toast(err.message); }
  }

  let auditOffset = 0;
  async function loadAudit(reset = false) {
    try {
      if (reset) { auditOffset = 0; $('#auditTable').innerHTML = ''; }
      const r = await api('GET', `/api/admin/audit?limit=50&offset=${auditOffset}`);
      if (reset) {
        $('#auditTable').innerHTML = '<tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th></tr>';
      }
      $('#auditTable').insertAdjacentHTML('beforeend', r.items.map((l) => `
        <tr>
          <td style="white-space:nowrap">${fmtTime(l.ts)}</td>
          <td>${l.actorName ? escapeHtml(l.actorName) : '系统'}<div class="card-meta">${escapeHtml(l.actorRole)}</div></td>
          <td class="code">${escapeHtml(l.action)}</td>
          <td class="card-meta">${l.targetType ? `${escapeHtml(l.targetType)} #${escapeHtml(l.targetId ?? '')}` : ''}</td>
        </tr>`).join(''));
      auditOffset += r.items.length;
      $('#auditMore').hidden = r.items.length < 50;
    } catch (err) { toast(err.message); }
  }
</script>
</body>
</html>
