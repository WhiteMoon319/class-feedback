<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提交反馈 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908b">
<link rel="stylesheet" href="/css/base.css?v=20260908b">
</head>
<body data-nav="/submit">
<header class="site-header"></header>
<main style="max-width:560px">
  <div class="page-head">
    <div>
      <h1 class="page-title">提交反馈</h1>
      <p class="page-sub">本次提交将使用一个<strong>全新的随机笔名</strong>对外展示，与你的昵称和其他反馈互不关联。</p>
    </div>
  </div>

  <section class="card">
    <form id="fbForm">
      <label for="title">标题（2-60 字）</label>
      <input type="text" id="title" required minlength="2" maxlength="60" placeholder="一句话概括问题">
      <label for="body">详细说明（5-4000 字）</label>
      <textarea id="body" required minlength="5" maxlength="4000" placeholder="说明情况、你的期望，或任何你认为班委需要知道的信息"></textarea>
      <div class="notice notice-info">
        请理性表达。违规内容会被隐藏，发布账号可被班委举报、由站长封禁。
      </div>
      <button class="btn btn-primary" type="submit">匿名提交</button>
    </form>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, cachedMe, requireLoginPage, toast, $ } from '/js/app.js?v=20260908b';
  init();
  if (requireLoginPage()) {
    $('#fbForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const r = await api('POST', '/api/feedbacks', {
          title: $('#title').value.trim(),
          body: $('#body').value.trim(),
        });
        toast(`已提交，本次笔名：${r.alias}`);
        setTimeout(() => { location.href = `/feedback?id=${r.id}`; }, 900);
      } catch (err) {
        toast(err.message);
        btn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
