<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班务公开 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908">
<link rel="stylesheet" href="/css/base.css?v=20260908">
</head>
<body data-nav="/announcements">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">班务公开</h1>
      <p class="page-sub">公告、班费收支（附凭证）、决议记录。游客可读。</p>
    </div>
  </div>

  <div class="tabs" id="catTabs" role="tablist">
    <button data-c="" aria-selected="true">全部</button>
    <button data-c="announcement">公告</button>
    <button data-c="finance">班费</button>
    <button data-c="minutes">决议</button>
  </div>

  <div id="list"></div>
  <div class="load-more"><button class="btn" id="moreBtn" hidden>加载更多</button></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, escapeHtml, categoryBadge, fmtTime, toast, skeleton, errorBox, $, $$ } from '/js/app.js?v=20260908';
  init();

  let cat = '';
  let offset = 0;

  function render(items) {
    if (items.length === 0 && offset === 0) {
      $('#list').innerHTML = '<div class="empty">这里还没有内容</div>';
      return;
    }
    $('#list').insertAdjacentHTML('beforeend', items.map((a, i) => `
      <div class="card card-enter" style="animation-delay:${Math.min(i * 40, 400)}ms">
        <div class="item-head">
          <a class="item-title" href="/announcement?id=${a.id}">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</a>
          ${categoryBadge(a)}
        </div>
        <div class="card-meta">
          <span>${escapeHtml(a.duty)}</span>
          <span>${fmtTime(a.createdAt)}</span>
          ${a.amount ? `<span class="amount-${a.direction === 'expense' ? 'expense' : 'income'}">${a.direction === 'expense' ? '支出' : '收入'} ¥${escapeHtml(a.amount.replace('-', ''))}</span>` : ''}
        </div>
        <p class="item-excerpt">${escapeHtml((a.body || '').slice(0, 120))}${(a.body || '').length > 120 ? '…' : ''}</p>
        ${a.attachments?.length ? `<div class="card-meta"><span>📎 ${a.attachments.length} 个附件</span></div>` : ''}
      </div>`).join(''));
  }

  async function load(reset = false) {
    if (reset) { offset = 0; $('#list').innerHTML = skeleton(4); }
    try {
      const r = await api('GET', `/api/announcements?limit=20&offset=${offset}${cat ? `&category=${cat}` : ''}`);
      if (reset) $('#list').innerHTML = '';
      render(r.items);
      offset += r.items.length;
      $('#moreBtn').hidden = r.items.length < 20;
    } catch (err) {
      if (offset === 0) $('#list').innerHTML = errorBox(err.message, () => load(true));
      else toast(err.message);
    }
  }

  $('#catTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-c]');
    if (!btn) return;
    $$('#catTabs button').forEach((b) => b.setAttribute('aria-selected', b === btn));
    cat = btn.dataset.c;
    load(true);
  });

  $('#moreBtn').addEventListener('click', () => load());

  $('#list').innerHTML = skeleton(4);
  load();
</script>
</body>
</html>
