<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908c">
<link rel="stylesheet" href="/css/base.css?v=20260908c">
</head>
<body data-nav="/">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">班务平台</h1>
      <p class="page-sub">匿名向班委反映问题，公开查阅班务收支与决议投票。</p>
    </div>
  </div>

  <section class="card">
    <div class="card-title">匿名反馈</div>
    <p class="item-excerpt">每次提交都会使用全新的随机笔名，没有人能通过名字认出你——包括班委和站长。</p>
    <div class="page-head-actions" style="margin-top:var(--space-4)">
      <a class="btn btn-primary" href="/submit">提交反馈</a>
      <a class="btn" href="/feedbacks">反馈广场</a>
    </div>
  </section>

  <section class="card">
    <div class="card-title">班务公开</div>
    <p class="item-excerpt">公告、班费收支（附凭证照片）、决议投票，无需登录即可查看。</p>
    <div class="page-head-actions" style="margin-top:var(--space-4)">
      <a class="btn" href="/announcements">查看班务</a>
      <a class="btn" href="/polls">投票</a>
    </div>
  </section>

  <section class="card" id="meCard" hidden>
    <div class="card-title">我的身份</div>
    <p class="item-excerpt">你的昵称是 <strong id="meRoot"></strong>（仅你自己可见）。<a href="/mine">查看我的反馈</a></p>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, refreshMe, $ } from '/js/app.js?v=20260908c';
  init();
  const me = await refreshMe();
  if (me) {
    $('#meCard').hidden = false;
    $('#meRoot').textContent = me.displayName;
  }
</script>
</body>
</html>
