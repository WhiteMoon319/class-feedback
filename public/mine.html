<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的反馈 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
</head>
<body data-nav="/mine">
<header class="site-header"></header>
<main>
  <h1 class="page-title">我的反馈</h1>
  <p class="page-sub">按你的账号聚合，仅登录后自己可见。每条反馈的对外笔名各不相同。</p>
  <div id="list"></div>
  <div class="load-more"><button class="btn" id="moreBtn" hidden>加载更多</button></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, refreshMe, api, escapeHtml, statusBadge, fmtTime, requireLoginPage, toast, skeleton, errorBox, $ } from '/js/app.js';
  init();
  if (requireLoginPage()) {
    await refreshMe();
    let offset = 0;

    function render(items) {
      if (items.length === 0 && offset === 0) {
        $('#list').innerHTML = '<div class="empty">你还没有提交过反馈</div>';
        return;
      }
      $('#list').insertAdjacentHTML('beforeend', items.map((f) => `
        <div class="card">
          <div class="item-head">
            <a class="item-title" href="/feedback?id=${f.id}">${escapeHtml(f.title)}</a>
            ${statusBadge(f.status)}
          </div>
          <div class="card-meta" style="margin:var(--space-2) 0">
            <span>对外笔名：${escapeHtml(f.alias)}</span>
            <span>${fmtTime(f.createdAt)}</span>
          </div>
          <p style="margin:0;color:var(--c-text-2);white-space:pre-wrap">${escapeHtml(f.body.length > 80 ? f.body.slice(0, 80) + '…' : f.body)}</p>
        </div>`).join(''));
    }

    async function load(reset = false) {
      if (reset) { offset = 0; $('#list').innerHTML = skeleton(3); }
      try {
        const r = await api('GET', `/api/my/feedbacks?limit=20&offset=${offset}`);
        if (reset) $('#list').innerHTML = '';
        render(r.items);
        offset += r.items.length;
        $('#moreBtn').hidden = offset >= r.items.length || r.items.length === 0;
      } catch (err) {
        if (offset === 0) $('#list').innerHTML = errorBox(err.message, () => load(true));
        else toast(err.message);
      }
    }

    $('#moreBtn').addEventListener('click', () => load());
    $('#list').innerHTML = skeleton(3);
    load();
  }
</script>
</body>
</html>
