<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908">
<link rel="stylesheet" href="/css/base.css?v=20260908">
</head>
<body data-nav="/login">
<header class="site-header"></header>
<main style="max-width:460px">
  <div class="page-head">
    <div>
      <h1 class="page-title">注册</h1>
      <p class="page-sub">需要班级群里领取的邀请码。注册后你将获得一个昵称作为登录名——可以自己起，也可以随机生成。</p>
    </div>
  </div>

  <section class="card" id="formCard">
    <form id="regForm">
      <label for="invite">邀请码</label>
      <input type="text" id="invite" placeholder="XXXX-XXXX-XXXX" required maxlength="32" style="text-transform:uppercase">
      <label for="nick">昵称（登录名；留空则随机生成）</label>
      <div style="display:flex;gap:var(--space-2)">
        <input type="text" id="nick" maxlength="20" placeholder="如：奶茶三分糖" autocomplete="username">
        <button class="btn" type="button" id="randomNick" style="white-space:nowrap">随机一个</button>
      </div>
      <div class="notice notice-info">
        昵称对全班可见，建议不要用真名或学号。支持中文、英文、数字、下划线、连字符。
      </div>
      <label for="password">设置密码（8 位以上）</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8" maxlength="64">
      <div style="margin-top:var(--space-4)">
        <button class="btn btn-primary" type="submit">注册</button>
      </div>
    </form>
  </section>

  <section class="card" id="doneCard" hidden>
    <div class="card-title">注册成功</div>
    <p class="item-excerpt">你的昵称是：</p>
    <p style="font-size:20px;font-weight:700;margin:0 0 var(--space-4)" id="rootName"></p>
    <p class="item-excerpt">恢复码是密码找回的唯一凭据，<strong>平台不保留副本，关闭本页后不再显示</strong>，请立即保存：</p>
    <div class="recovery-code recovery-code-pop" id="recoveryCode"></div>
    <div style="margin-top:var(--space-4);display:flex;gap:var(--space-2)">
      <button class="btn" id="copyBtn" type="button">复制恢复码</button>
      <button class="btn btn-primary" id="doneBtn" type="button">我已保存，进入平台</button>
    </div>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, setCachedMe, toast, afterLoginGo, $ } from '/js/app.js?v=20260908';
  init();

  $('#regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const r = await api('POST', '/api/auth/register', {
        inviteCode: $('#invite').value.trim().toUpperCase(),
        password: $('#password').value,
        displayName: $('#nick').value.trim() || undefined,
      });
      setCachedMe(r.member);
      $('#rootName').textContent = r.member.displayName;
      $('#recoveryCode').textContent = r.recoveryCode;
      $('#formCard').hidden = true;
      $('#doneCard').hidden = false;
      sessionStorage.setItem('cf_after_login', '/mine');
    } catch (err) {
      toast(err.message);
      btn.disabled = false;
    }
  });

  $('#copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('#recoveryCode').textContent); toast('已复制'); }
    catch { toast('复制失败，请手动抄写'); }
  });

  // 「随机一个」：前端同款词库生成建议名，提交时后端仍会查重
  const NICK_ADJ = ['安静', '明亮', '遥远', '温和', '慵懒', '好奇', '从容', '清爽', '沉默', '自由', '沉稳', '认真'];
  const NICK_NOUN = ['橘子', '雨伞', '书签', '台灯', '盆栽', '风筝', '麦穗', '银杏', '刺猬', '云朵', '晚风', '咖啡'];
  $('#randomNick').addEventListener('click', () => {
    const a = NICK_ADJ[Math.floor(Math.random() * NICK_ADJ.length)];
    const n = NICK_NOUN[Math.floor(Math.random() * NICK_NOUN.length)];
    $('#nick').value = `${a}的${n}`;
  });

  $('#doneBtn').addEventListener('click', afterLoginGo);
</script>
</body>
</html>
