<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908">
<link rel="stylesheet" href="/css/base.css?v=20260908">
</head>
<body data-nav="/polls">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">投票</h1>
      <p class="page-sub">班级决议的投票表决。一人一票，截止前可改票；投票者身份对所有人不可见。</p>
    </div>
  </div>

  <div id="list"></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, refreshMe, isCommittee, escapeHtml, fmtTime, toast, skeleton, errorBox, initReveal, $ } from '/js/app.js?v=20260908';
  init();
  const me = await refreshMe();

  function countdown(expires) {
    const left = new Date(expires.replace(' ', 'T') + 'Z') - Date.now();
    if (left <= 0) return '已结束';
    const h = Math.floor(left / 3600_000);
    const m = Math.floor((left % 3600_000) / 60_000);
    return h > 0 ? `剩余 ${h} 小时 ${m} 分` : `剩余 ${m} 分`;
  }

  function render(items) {
    let html = items.length ? items.map((p, i) => `
      <div class="card card-reveal" style="animation-delay:${Math.min(i * 80, 480)}ms">
        <div class="item-head">
          <a class="item-title" href="/poll?id=${p.id}">${escapeHtml(p.title)}</a>
          <span class="badge ${p.status === 'open' ? 'badge-in_review' : 'badge-resolved'}">${p.statusText}</span>
        </div>
        <div class="card-meta">
          <span>${escapeHtml(p.duty)} 发起</span>
          <span>${fmtTime(p.createdAt)}</span>
          <span>${p.status === 'open' ? countdown(p.expiresAt) : '已截止'}</span>
          <span>${p.hideResults && p.status === 'open' ? '结果截止后公开' : `${p.totalVotes} 人已投`}</span>
          ${p.myVote != null ? '<span class="badge badge-committee">已投</span>' : ''}
        </div>
        <p class="item-excerpt">${escapeHtml((p.description || '').slice(0, 100))}</p>
      </div>`).join('') : '<div class="empty">还没有投票</div>';
    if (isCommittee()) {
      html = '<div class="card"><a class="btn btn-primary" href="/poll?new=1">发起新投票</a></div>' + html;
    }
    $('#list').innerHTML = html;
    initReveal('#list');
  }

  $('#list').innerHTML = skeleton(3);
  let items;
  try {
    const r = await api('GET', '/api/polls');
    items = r.items;
  } catch (err) {
    $('#list').innerHTML = errorBox(err.message, async () => { location.reload(); });
  }

  if (items) render(items);

  // 列表页只需分钟级信息：30 秒整体重渲染（数据量小），不逐秒重排
  const listTimer = setInterval(() => { if (items && !document.hidden) render(items); }, 30_000);
  window.addEventListener('pagehide', () => clearInterval(listTimer));
</script>
</body>
</html>
