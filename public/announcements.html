<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班务公开 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css?v=20260908b">
<link rel="stylesheet" href="/css/base.css?v=20260908b">
</head>
<body data-nav="/announcements">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">班务公开</h1>
      <p class="page-sub">公告、班费收支（附凭证）、决议记录。游客可读。</p>
    </div>
  </div>

  <div class="tabs" id="catTabs" role="tablist">
    <button data-c="" aria-selected="true">全部</button>
    <button data-c="announcement">公告</button>
    <button data-c="finance">班费</button>
    <button data-c="minutes">决议</button>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, escapeHtml, categoryBadge, fmtTime, toast, skeleton, errorBox, initReveal, renderPager, $, $$ } from '/js/app.js?v=20260908b';
  init();

  let cat = '';
  let page = 1;
  let total = 0;
  const PAGE_SIZE = 20;

  function render(items) {
    if (items.length === 0) {
      $('#list').innerHTML = '<div class="empty">这里还没有内容</div>';
      return;
    }
    $('#list').innerHTML = items.map((a, i) => `
      <div class="card card-reveal" style="animation-delay:${Math.min(i * 80, 480)}ms">
        <div class="item-head">
          <a class="item-title" href="/announcement?id=${a.id}">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</a>
          ${categoryBadge(a)}
        </div>
        <div class="card-meta">
          <span>${escapeHtml(a.duty)}</span>
          <span>${fmtTime(a.createdAt)}</span>
          ${a.amount ? `<span class="amount-${a.direction === 'expense' ? 'expense' : 'income'}">${a.direction === 'expense' ? '支出' : '收入'} ¥${escapeHtml(a.amount.replace('-', ''))}</span>` : ''}
        </div>
        <p class="item-excerpt">${escapeHtml((a.body || '').slice(0, 120))}${(a.body || '').length > 120 ? '…' : ''}</p>
        ${a.attachments?.length ? `<div class="card-meta"><span>📎 ${a.attachments.length} 个附件</span></div>` : ''}
      </div>`).join('');
    initReveal('#list');
  }

  async function load(target = page) {
    page = target;
    $('#list').innerHTML = skeleton(4);
    try {
      const r = await api('GET', `/api/announcements?limit=${PAGE_SIZE}&offset=${(page - 1) * PAGE_SIZE}${cat ? `&category=${cat}` : ''}`);
      total = r.total;
      render(r.items);
      renderPager($('#pager'), {
        page,
        totalPages: Math.ceil(total / PAGE_SIZE),
        onPage: (p) => { window.scrollTo({ top: 0 }); load(p); },
      });
    } catch (err) {
      $('#list').innerHTML = errorBox(err.message, () => load(page));
    }
  }

  $('#catTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-c]');
    if (!btn) return;
    $$('#catTabs button').forEach((b) => b.setAttribute('aria-selected', b === btn));
    cat = btn.dataset.c;
    load(1);
  });

  $('#list').innerHTML = skeleton(4);
  load();
</script>
</body>
</html>
