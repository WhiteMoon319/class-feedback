<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反馈详情 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
</head>
<body data-nav="/feedbacks">
<header class="site-header"></header>
<main>
  <div id="detail"></div>
  <section class="card">
    <div class="card-title">回复</div>
    <div id="replies"></div>
    <form id="replyForm" hidden>
      <label for="replyBody">补充回复</label>
      <textarea id="replyBody" required maxlength="2000" placeholder="补充说明或处理进展"></textarea>
      <label id="anonRow" style="display:flex;gap:var(--space-2);align-items:center">
        <input type="checkbox" id="anonChk" style="width:auto"> 匿名回复（对外显示「班委」）
      </label>
      <div style="margin-top:var(--space-3)">
        <button class="btn btn-primary" type="submit">发送</button>
      </div>
    </form>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, cachedMe, isCommittee, escapeHtml, statusBadge, fmtTime, toast, skeleton, errorBox, $, $$ } from '/js/app.js';
  init();

  const id = new URLSearchParams(location.search).get('id');
  if (!id || !/^\d+$/.test(id)) { location.href = '/feedbacks'; }
  const me = await refresh();
  async function refresh() {
    const me = cachedMe();
    let fb, replies;
    $('#detail').innerHTML = `<div class="card">${skeleton(5)}</div>`;
    $('#replies').innerHTML = '';
    try {
      const r = await api('GET', `/api/feedbacks/${id}`);
      fb = r.feedback; replies = r.replies;
    } catch (err) {
      $('#detail').innerHTML = errorBox(err.message, () => location.reload());
      $('#replies').innerHTML = '';
      return null;
    }

    $('#detail').innerHTML = `
      <div class="card">
        <div class="item-head" style="margin-bottom:var(--space-2)">
          <h1 class="page-title" style="margin:0">${escapeHtml(fb.title)}</h1>
          ${statusBadge(fb.status)}
        </div>
        <div class="card-meta" style="margin-bottom:var(--space-4)">
          <span>${escapeHtml(fb.alias)}</span><span>${fmtTime(fb.createdAt)}</span>
        </div>
        <p class="item-excerpt">${escapeHtml(fb.body)}</p>
        <div id="statusOps" hidden>
          <span class="card-meta">状态：</span>
          <button class="btn btn-sm" data-status="pending" type="button">待处理</button>
          <button class="btn btn-sm" data-status="in_review" type="button">处理中</button>
          <button class="btn btn-sm" data-status="resolved" type="button">已解决</button>
        </div>
        <details class="menu">
          <summary>举报这条反馈</summary>
          <div style="margin-top:var(--space-2)">
            <input type="text" id="reportReason" maxlength="500" placeholder="说明举报理由（2-500 字）" style="margin-bottom:var(--space-2)">
            <button class="btn btn-sm btn-danger" id="reportBtn" type="button">提交举报</button>
          </div>
        </details>
      </div>`;

    $('#replies').innerHTML = replies.length
      ? replies.map((r) => `
        <div class="reply">
          <span class="reply-author">${escapeHtml(r.displayName)}</span>
          ${r.isCommittee ? '<span class="badge badge-committee">班委</span>' : ''}
          <div class="card-meta">${fmtTime(r.createdAt)}</div>
          <p class="item-excerpt">${escapeHtml(r.body)}</p>
        </div>`).join('')
      : '<div class="empty" style="padding:var(--space-3) 0">暂无回复</div>';

    // 回复框：登录即可尝试，归属校验由后端做（学生只能回复自己的反馈）。
    // 班委显示匿名选项，placeholder 提示默认署职务。
    if (me) {
      $('#replyForm').hidden = false;
      $('#anonRow').style.display = isCommittee() ? 'flex' : 'none';
      if (isCommittee()) $('#replyForm textarea').placeholder = '以「' + (me.duty || '班委') + '」身份回复，勾选则显示「班委」';
      else $('#replyForm textarea').placeholder = '补充说明（将沿用本次笔名）';
    }

    // 状态流转：仅班委/维护者可见，点选即更新（后端会追加一条状态变更回复）
    if (isCommittee()) {
      $('#statusOps').hidden = false;
      $$('#statusOps button').forEach((b) => {
        b.classList.toggle('btn-primary', b.dataset.status === fb.status);
        b.addEventListener('click', async () => {
          if (b.dataset.status === fb.status) return;
          b.disabled = true;
          try {
            await api('POST', `/api/feedbacks/${id}/status`, { status: b.dataset.status });
            toast('状态已更新');
            location.reload();
          } catch (err) { toast(err.message); b.disabled = false; }
        });
      });
    }

    $('#reportBtn')?.addEventListener('click', async () => {
      try {
        await api('POST', `/api/feedbacks/${id}/report`, {
          targetType: 'feedback', targetId: Number(id), reason: $('#reportReason').value.trim(),
        });
        toast('已提交举报，班委会尽快处理');
        $('#reportReason').value = '';
      } catch (err) { toast(err.message); }
    });

    return { fb, replies };
  }

  $('#replyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('POST', `/api/feedbacks/${id}/replies`, {
        body: $('#replyBody').value.trim(),
        anonymous: $('#anonChk')?.checked || false,
      });
      toast('已发送');
      location.reload();
    } catch (err) { toast(err.message); }
  });
</script>
</body>
</html>
