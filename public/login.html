<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 班务平台</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
</head>
<body data-nav="/login">
<header class="site-header"></header>
<main style="max-width:420px">
  <div class="page-head">
    <div>
      <h1 class="page-title">登录</h1>
      <p class="page-sub">使用你的昵称登录。忘记密码请用注册时保存的恢复码。</p>
    </div>
  </div>

  <section class="card">
    <form id="loginForm">
      <label for="name">昵称</label>
      <input type="text" id="name" autocomplete="username" required maxlength="40">
      <label for="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" required maxlength="64">
      <div style="margin-top:var(--space-4);display:flex;gap:var(--space-2);align-items:center">
        <button class="btn btn-primary" type="submit">登录</button>
        <a href="/register" style="font-size:13.5px">用邀请码注册</a>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="card-title">忘记密码？</div>
    <a href="/reset" style="font-size:13.5px">用恢复码重置密码</a>
  </section>
</main>
<footer class="site-footer"></footer>
<script type="module">
  import { init, api, toast, afterLoginGo, $ } from '/js/app.js';
  init();
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      await api('POST', '/api/auth/login', {
        name: $('#name').value.trim(),
        password: $('#password').value,
      });
      afterLoginGo();
    } catch (err) {
      toast(err.message);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
